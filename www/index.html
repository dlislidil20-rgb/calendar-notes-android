<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f9f9f9"><title>달력기록</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand">달력기록 <small>내 휴대폰에만 저장</small></div><nav><button data-tab="week" class="active">주간</button><button data-tab="day">일간</button><button data-tab="settings">설정</button></nav></header>
<main><div id="toolbar"><button id="prev" aria-label="이전">‹</button><strong id="period"></strong><button id="today">오늘</button><button id="next" aria-label="다음">›</button></div><div id="content"></div></main>
<div id="editor" class="hidden" role="dialog" aria-modal="true"><div class="editor-panel"><div class="edit-head"><button id="edit-prev" aria-label="전날">‹</button><strong id="edit-date"></strong><button id="edit-next" aria-label="다음날">›</button><button id="close" aria-label="닫기">✕</button></div><div class="edit-tools"><button id="insert-time">+ 시간 선택</button><input id="time-picker" type="time" aria-label="시간 선택" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"><button id="insert-shop">+ 가게명</button><button id="insert-menu">+ 메뉴명</button></div><label for="note">기록 (줄바꿈 그대로 표시)</label><textarea wrap="off" id="note" placeholder="11:40&#10;[가게이름]&#10;먹은 메뉴"></textarea><div class="edit-info">좌우로 밀어 날짜 이동 · 이동 시 작성 내용 자동 저장</div><div class="actions"><button id="delete">기록 삭제</button><button id="save">저장하고 닫기</button></div></div></div>
<div id="catalog-dialog" class="hidden" role="dialog" aria-modal="true" aria-labelledby="catalog-title"><section class="catalog-panel">
<div class="catalog-head"><h2 id="catalog-title">가게명</h2><button id="catalog-close">닫기</button></div>
<p class="catalog-help">저장한 항목을 누르면 기록에 입력됩니다.</p>
<form id="catalog-form"><label class="sr-only" for="catalog-input">검색 또는 새 항목</label><input id="catalog-input" autocomplete="off" maxlength="120" placeholder="검색하거나 새 가게명 입력"><button id="catalog-save" type="submit">저장</button><button id="catalog-cancel-edit" type="button" class="hidden">취소</button></form>
<div id="catalog-status" role="status" aria-live="polite"></div><div id="catalog-list"></div>
</section></div>
<script src="holidays.js"></script><script src="app.js"></script></body></html>
