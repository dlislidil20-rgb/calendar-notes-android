<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f9f9f9"><title>달력기록</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand">달력기록 <small>내 휴대폰에만 저장</small></div><nav><button data-tab="week" class="active">주간</button><button data-tab="day">일간</button><button data-tab="settings">설정</button></nav></header>
<main><div id="toolbar"><button id="prev" aria-label="이전">‹</button><strong id="period"></strong><button id="today">오늘</button><button id="next" aria-label="다음">›</button></div><div id="content"></div></main>
<div id="editor" class="hidden" role="dialog" aria-modal="true"><div class="editor-panel"><div class="edit-head"><button id="edit-prev" aria-label="전날">‹</button><strong id="edit-date"></strong><button id="edit-next" aria-label="다음날">›</button><button id="close" aria-label="닫기">✕</button></div><div class="edit-tools"><button id="insert-time">+ 시간 선택</button><input id="time-picker" type="time" aria-label="시간 선택" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"><button id="insert-shop">+ 가게 이름</button><button id="sort-time">시간순 정렬</button></div><label for="note">기록 (줄바꿈 그대로 표시)</label><textarea wrap="off" id="note" placeholder="11:40&#10;[가게이름]&#10;먹은 메뉴"></textarea><div class="edit-info">좌우로 밀어 날짜 이동 · 이동 시 작성 내용 자동 저장</div><div class="actions"><button id="delete">기록 삭제</button><button id="save">저장하고 닫기</button></div></div></div>
<script src="app.js"></script></body></html>
