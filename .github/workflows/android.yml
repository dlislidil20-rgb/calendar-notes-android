name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm test
      - run: npx cap sync android
      - name: Build and lint Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --stacktrace
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual Android 16 UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            cd android && ./gradlew :app:connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Download/calendar-ui ui-screenshots
      - name: Upload Android UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android16-ui-test-results
          path: |
            android/app/build/reports/androidTests/
            ui-screenshots/
      - name: Verify installable signed APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep -q android.permission.INTERNET; then
            echo 'Unexpected Internet permission'; exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/calendar-notes-v4.1.apk
          sha256sum dist/calendar-notes-v4.1.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-notes-v4.1-apk
          path: dist/
          if-no-files-found: error
          retention-days: 90
